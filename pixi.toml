[workspace]
channels = ["conda-forge"]
name = "refrax"
platforms = ["linux-64", "osx-arm64", { name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[tasks]
remove-refraction = "python remove_refraction.py"
visualise-refraction = "python visualise_refraction.py"
planarity = "python evaluation/planarity.py"
test = "pytest tests -q"

[dependencies]
python = ">=3.10"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
opencv = ">=4.8"
pyyaml = ">=6.0"
numba = ">=0.68.0,<0.69"
pytest = ">=9.1.1,<10"

# Optional environments, shared by all GPU and depth work:
#   gpu   - PyTorch (CPU / Apple MPS) and NVIDIA Warp
#   cuda  - gpu + CUDA 12 builds of PyTorch (linux-64 with an NVIDIA driver)
#   depth - gpu + COLMAP and Depth Anything (transformers)
[feature.gpu.dependencies]
pytorch = ">=2.4"
warp-lang = ">=1.17.0,<2"

[feature.cuda]
platforms = ["linux-64-cuda-12"]

[feature.cuda.dependencies]
pytorch-gpu = "*"

[feature.depth.dependencies]
colmap = ">=3.11"
torchvision = "*"
transformers = ">=4.45"
huggingface_hub = "*"
pillow = "*"
safetensors = "*"

[environments]
gpu = { features = ["gpu"], solve-group = "default" }
cuda = { features = ["gpu", "cuda"] }
depth = { features = ["gpu", "depth"], solve-group = "default" }

[feature.gpu.tasks]
test-gpu = "pytest tests/test_torch_remove.py -q"
bench-remove-gpu = "python benchmarks/bench_gpu.py configs/dataset.yaml"
refraction-uncertainty = "python refraction_uncertainty.py"
test-uncertainty = "pytest tests/test_uncertainty.py -q"
uncertainty-analysis = "python uncertainty/sensitivity.py && python uncertainty/mc_validate.py && python uncertainty/figures.py"
# port-tilt estimation in a refractive BA (docs/explore_tilt.md)
test-tilt = "pytest tests/test_tilt.py -q"
tilt-identifiability = "python tilt/identifiability.py"
tilt-synthetic = "python tilt/synthetic.py"
tilt-real = "python tilt/real.py"
tilt-feedback = "python tilt/feedback.py"
tilt-analysis = "python tilt/identifiability.py && python tilt/synthetic.py && python tilt/figures.py"

[feature.depth.tasks]
bench-depth-anything = "python benchmarks/bench_depth_anything.py"
