# Separate pixi workspace for the Isaac Sim adapter (Linux x86_64 / Windows + NVIDIA RTX GPU).
# Kept apart from the main Refrax workspace so its lock file stays small and macOS-installable.
# UNTESTED: no RTX GPU was available when this was written.
[workspace]
name = "refrax-isaacsim"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"          # Isaac Sim 6.x wheels are cp312 only (5.x: use python 3.11 + isaacsim 5.1.0)
pip = "*"

[pypi-dependencies]
isaacsim = { version = "==6.2.0.0", extras = ["all", "extscache"] }
opencv-python-headless = "*"
pyyaml = "*"
scipy = "*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

# Isaac Sim asks you to accept the NVIDIA EULA on first start; to accept it non-interactively
# export OMNI_KIT_ACCEPT_EULA=YES yourself.

[tasks]
render = "python render_flatport_isaacsim.py"
